modes:
  - title:
      es: Dirección creativa y de arte
      en: Creative and art direction
    body:
      es: >-
        Desarrollo conceptos a partir de un brief o doy forma visual a una idea
        de tu equipo. Defino el tono y el lenguaje visual para que la
        experiencia se sienta propia de la marca.
      en: >-
        I develop concepts from a brief or give visual shape to an idea from
        your team. I set the tone and visual language so the experience feels
        true to the brand.
  - title:
      es: Diseño de experiencias interactivas
      en: Interactive experience design
    body:
      es: >-
        Diseño qué hace el público y cómo responde la experiencia. Cuando hace
        falta probar una interacción antes de producirla, construyo un prototipo
        o una demo funcional.
      en: >-
        I design what the audience does and how the experience responds. When an
        interaction needs testing before production, I build a prototype or a
        working demo.
  - title:
      es: Producción 3D y dirección técnica
      en: 3D production and technical direction
    body:
      es: >-
        Produzco visuales 3D, VFX y contenido en tiempo real. Según el alcance,
        coordino artistas y acompaño la integración técnica hasta el montaje.
      en: >-
        I produce 3D visuals, VFX and real-time content. Depending on the scope,
        I coordinate artists and see the technical integration through to
        installation.
