bio:
  es: >-
    Soy Ethan Nava, Creative Director y Creative Technologist en la Ciudad de
    México. Llevo cerca de ocho años trabajando entre la estética y la
    tecnología: shows en vivo, juegos para activaciones, experiencias inmersivas
    y contenido en tiempo real para marcas, artistas e instituciones.


    Mi trabajo va de la dirección de arte a la construcción del sistema que
    corre el día del evento: worldbuilding procedural en Houdini, mundos y VFX
    en Unreal Engine 5, captura de movimiento e interacción con el público.
  en: >-
    I'm Ethan Nava, a Creative Director and Creative Technologist based in
    Mexico City. For about eight years I have worked between aesthetics and
    technology: live shows, activation games, immersive experiences and
    real-time content for brands, artists and institutions.


    My work runs from art direction to building the system that runs on show
    day: procedural worldbuilding in Houdini, worlds and VFX in Unreal Engine 5,
    motion capture and audience interaction.
