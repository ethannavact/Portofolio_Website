name: Diseño y montaje de stands para eventos
published: true
order: 110
title:
  es: Diseño y montaje de stands para eventos
  en: Event booth design and build
tagline:
  es: >-
    Stands y espacios de marca para expos y eventos, del diseño al montaje, con
    la experiencia integrada.
  en: >-
    Booths and brand spaces for expos and events, from design to build, with the
    experience built in.
intro:
  es: >-
    Diseño stands donde la experiencia es parte del espacio desde el principio:
    pantallas, juegos, iluminación y recorrido pensados juntos. Coordino la
    producción y el montaje con proveedores para que lo que se diseñó sea lo que
    se construye.


    Un stand tiene que atraer desde el pasillo, explicar la marca en segundos y
    convertir visitas en contactos. Lo diseño con esos tres objetivos.
  en: >-
    I design booths where the experience is part of the space from day one:
    screens, games, lighting and flow planned together. I coordinate production
    and build with vendors so what was designed is what gets built.


    A booth has to pull people in from the aisle, explain the brand in seconds
    and turn visits into leads. I design for those three goals.
fit:
  - es: >-
      Tu marca va a una expo o congreso y necesita destacar entre cientos de
      stands.
    en: >-
      Your brand is going to an expo or congress and needs to stand out among
      hundreds of booths.
  - es: Quieres que el stand capture registros de calidad.
    en: You want the booth to capture quality leads.
  - es: Necesitas un espacio que se pueda montar en varias ciudades o eventos.
    en: You need a space that can be set up in several cities or events.
