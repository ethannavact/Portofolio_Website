name: Videoclips
published: true
order: 90
title:
  es: Videoclips
  en: Music videos
tagline:
  es: >-
    Videoclips y contenido para artistas con mundos digitales, personajes y
    efectos.
  en: Music videos and artist content with digital worlds, characters and effects.
intro:
  es: >-
    Construyo los mundos donde ocurre el video: una ciudad digital, un bosque
    que crece con la voz de una artista, un set virtual sin pantalla verde.
    Trabajo con el director y el artista para que el video tenga una identidad
    visual propia y se pueda producir con el presupuesto real.


    También acompaño a artistas que quieren hacer su propio video con estas
    herramientas, desde la asesoría hasta los efectos finales.
  en: >-
    I build the worlds where the video happens: a digital city, a forest that
    grows with an artist’s voice, a virtual set with no green screen. I work
    with the director and the artist so the video has its own visual identity
    and can be made on the real budget.


    I also guide artists who want to make their own video with these tools, from
    advice to final effects.
fit:
  - es: Un artista quiere un video imposible de grabar en una locación real.
    en: An artist wants a video that could never be shot on a real location.
  - es: Un director necesita un set virtual o un mundo digital para su idea.
    en: A director needs a virtual set or a digital world for their idea.
  - es: >-
      Un lanzamiento necesita contenido visual que acompañe a la canción en
      redes y en vivo.
    en: A release needs visuals that carry the song on social and on stage.
