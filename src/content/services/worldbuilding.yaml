reviewNotes: >-
  Copy provisional: se reescribe junto con la identidad (target: agencias y
  marcas, sin jerga técnica).


  Basado en The Worldbuilding Playbook 3.1 (tesis, fases 0–6, prueba de 3
  segundos). Decidir si se muestra el modelo por etapas (Fundación /
  Construcción / Evolución). NIAG es el ejemplo más cercano a un mundo de marca
  completo; los demás son mundos visuales.
