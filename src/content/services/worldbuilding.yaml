name: Worldbuilding
published: true
order: 20
title:
  es: Worldbuilding
  en: Worldbuilding
tagline:
  es: >-
    Un universo propio para tu marca: reglas, historia, estética y rituales que
    la gente puede recorrer, recordar y volver a visitar.
  en: >-
    A world of its own for your brand: rules, story, aesthetics and rituals
    people can step into, remember and come back to.
intro:
  es: >-
    Una campaña se olvida cuando deja de pautarse. Un mundo de marca es un
    universo coherente, con sus propios lugares, personajes, lenguaje y
    rituales, que crece con cada pieza nueva. Cada activación, video o espacio
    suma al mismo activo en lugar de empezar de cero.


    Trabajo desde la cultura que rodea a la marca hasta la biblia del mundo y
    las experiencias donde se vive. El resultado se reconoce en tres segundos
    aunque no se vea el logo, y tiene profundidad para quien quiere quedarse
    horas.
  en: >-
    A campaign is forgotten when the media stops. A brand world is a coherent
    universe, with its own places, characters, language and rituals, that grows
    with every new piece. Each activation, film or space adds to the same asset
    instead of starting from zero.


    I work from the culture around the brand to the world bible and the
    experiences where it lives. The result is recognizable in three seconds even
    without the logo, with enough depth for anyone who wants to stay for hours.
fit:
  - es: >-
      La marca se parece a su competencia y necesita un territorio que nadie más
      pueda reclamar.
    en: >-
      The brand looks like its competitors and needs territory nobody else can
      claim.
  - es: >-
      Vas a lanzar una plataforma, sub-marca o propiedad que tiene que vivir
      varias temporadas.
    en: >-
      You are launching a platform, sub-brand or property that has to live for
      several seasons.
  - es: >-
      Cada agencia o proveedor interpreta la marca distinto y hace falta una
      referencia común.
    en: >-
      Every agency or vendor reads the brand differently and you need one shared
      reference.
  - es: >-
      Quieres que experiencias, contenido y producto se sientan del mismo
      universo.
    en: You want experiences, content and product to feel like the same universe.
includes:
  - title:
      es: Inmersión y estrategia cultural
      en: Immersion and cultural strategy
    body:
      es: >-
        La tensión cultural que la marca puede resolver y el territorio real del
        que se alimenta el mundo.
      en: >-
        The cultural tension the brand can resolve and the real territory the
        world draws from.
  - title:
      es: Concepto del mundo
      en: World concept
    body:
      es: >-
        La idea central en una página: premisa, personalidad, mito, reglas y lo
        que el mundo no es.
      en: >-
        The central idea on one page: premise, personality, myth, rules and what
        the world is not.
  - title:
      es: Biblia del mundo
      en: World bible
    body:
      es: >-
        Historia, lugares, personajes, lenguaje y sistemas visual y sonoro: la
        guía de todo lo que se produzca.
      en: >-
        History, places, characters, language and visual and sound systems: the
        guide for everything produced.
  - title:
      es: Piezas insignia
      en: Flagship pieces
    body:
      es: >-
        Las primeras experiencias, visuales o espacios donde el mundo se vuelve
        tangible.
      en: >-
        The first experiences, visuals or spaces where the world becomes
        tangible.
  - title:
      es: Evolución
      en: Evolution
    body:
      es: >-
        Capítulos por temporada y reglas para que el mundo crezca sin
        contradecirse.
      en: >-
        Seasonal chapters and rules so the world grows without contradicting
        itself.
process:
  - title:
      es: Inmersión
      en: Immersion
    body:
      es: >-
        Negocio, cultura y métricas de corto y largo plazo acordadas desde el
        inicio.
      en: >-
        Business, culture, and short- and long-term metrics agreed from the
        start.
  - title:
      es: Concepto
      en: Concept
    body:
      es: Una sola idea de la que se desprende todo lo demás.
      en: One idea that everything else follows from.
  - title:
      es: Arquitectura
      en: Architecture
    body:
      es: >-
        La biblia del mundo: reglas, historia y sistemas visual, verbal y
        sensorial.
      en: 'The world bible: rules, story, and visual, verbal and sensory systems.'
  - title:
      es: Experiencia y lanzamiento
      en: Experience and launch
    body:
      es: >-
        Los puntos de contacto donde se vive y un lanzamiento que dé de qué
        hablar.
      en: The touchpoints where it lives and a launch worth talking about.
