title:
  es: FOOH
  en: FOOH
tagline:
  es: >-
    Videos donde algo imposible pasa en un lugar real de la ciudad, pensados
    para detener el scroll.
  en: >-
    Videos where something impossible happens in a real place in the city, made
    to stop the scroll.
intro:
  es: >-
    El FOOH (fake out of home) mezcla una toma real de la calle con efectos
    visuales: un robot que aterriza en un edificio, un espectacular que
    revienta, una fachada que se vuelve fábrica. Funciona porque la gente
    reconoce el lugar y no puede creer lo que ve.


    Me encargo de la idea, la toma y los efectos, con el realismo necesario para
    que la pieza se comparta y la marca quede como protagonista. El público sabe
    que es ficción, y justo por eso la disfruta y la comparte.
  en: >-
    FOOH (fake out of home) blends a real street shot with visual effects: a
    robot landing on a building, a billboard bursting, a façade turning into a
    factory. It works because people recognize the place and can’t believe what
    they see.


    I handle the idea, the shot and the effects, with the realism a piece needs
    to be shared while the brand stays the hero. The audience knows it’s
    fiction, and that is exactly why they enjoy it and pass it on.
fit:
