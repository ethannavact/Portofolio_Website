      Un estreno, lanzamiento o festival que necesita una pieza viral para
      redes.
    en: A premiere, launch or festival that needs a viral piece for social.
  - es: Quieres el impacto de un espectacular gigante sin producirlo en físico.
    en: You want the impact of a giant billboard without building it.
  - es: La marca quiere aparecer en un lugar icónico de la ciudad.
    en: The brand wants to show up in an iconic place in the city.
