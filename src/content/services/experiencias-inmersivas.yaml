      en: Mock-ups and simulations of the space before production.
  - title:
      es: Producción
      en: Production
    body:
      es: Contenido, interacción y pruebas por etapas.
      en: Content, interaction and testing in stages.
  - title:
      es: Montaje y operación
      en: Install and run
    body:
      es: Instalación, ajustes en sitio y acompañamiento en la apertura.
      en: Installation, on-site tuning and support at opening.
