name: Activaciones y juegos
published: true
order: 40
title:
  es: Activaciones y juegos
  en: Activations and games
tagline:
  es: >-
    Juegos y dinámicas para eventos y festivales que la gente quiere jugar,
    repetir y compartir.
  en: >-
    Games and experiences for events and festivals that people want to play,
    replay and share.
intro:
  es: >-
    Hago juegos de marca para stands, festivales y activaciones, desde la idea
    hasta el juego terminado y funcionando en sitio. Se juegan con el cuerpo,
    con controles físicos, con el celular o en realidad virtual, según lo que
    pida el espacio.


    Un buen juego de marca hace fila, se entiende en segundos y deja algo
    medible: registros, datos, contenido o tiempo con la marca. La marca vive
    dentro de la mecánica, más allá del logo en pantalla.
  en: >-
    I make brand games for booths, festivals and activations, from the idea to
    the finished game running on site. They are played with the body, physical
    controllers, a phone or VR, depending on the space.


    A good brand game draws a line, is understood in seconds and leaves
    something measurable: sign-ups, data, content or time with the brand. The
    brand lives inside the mechanic, beyond the logo on screen.
fit:
  - es: >-
      Tienes un stand o activación en un festival y necesitas algo que haga
      fila.
    en: >-
      You have a booth or activation at a festival and need something that draws
      a line.
  - es: >-
      La marca quiere registros o datos de su público a cambio de una
      experiencia que valga la pena.
    en: >-
      The brand wants sign-ups or audience data in exchange for an experience
      worth having.
  - es: Buscas una competencia que la gente quiera grabar y subir.
    en: You want a competition people will film and post.
  - es: Necesitas una experiencia que funcione semanas en un stand itinerante.
    en: You need an experience that runs for weeks on a touring booth.
